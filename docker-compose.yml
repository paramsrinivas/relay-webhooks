services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay']
      interval: 2s
      retries: 20
    volumes:
      - relay_pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
  relay:
    build: .
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
      PORT: '8080'
      WORKERS: '4'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  relay_pg:
